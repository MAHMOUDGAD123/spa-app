<div class="ask-question">
  <i class="fa-solid fa-circle-question"></i>

  <h1>ASK A QUESTION</h1>

  <form>
    <input
      type="text"
      name="questionIn"
      id="questionIn"
      placeholder="What is your question?"
      required
    />

    <div class="buttons">
      <button class="button empty" type="submit">Send</button>
      <div class="cancel button" id="__popupClose__">Cancel</div>
    </div>
  </form>
</div>
